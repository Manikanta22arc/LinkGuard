<!DOCTYPE html>
<html>

<head>
<title>Security Warning</title>
<link rel="stylesheet" href="warning.css">
</head>


<body>


<div class="page">


    <div class="content">


        <div class="icon">
            ✕
        </div>


        <h1>
            Dangerous site
        </h1>


        <p class="description">

            LinkGuard detected that this website may be unsafe.
            Attackers may try to steal your passwords,
            personal information, or payment details.

        </p>



        <div class="info">


            <div>
                <b>Blocked URL</b>

                <span id="url"></span>
            </div>


            <div>
                <b>Reason</b>

                <span id="reason"></span>
            </div>


        </div>



        <p class="recommend">

            LinkGuard recommends going back to safety.

        </p>



        <div class="buttons">


            <button id="back">

                Back to safety

            </button>


            <button id="continue">

                Continue anyway

            </button>


        </div>


    </div>


</div>


<script src="warning.js"></script>

</body>

</html>
